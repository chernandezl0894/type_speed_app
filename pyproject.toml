[project]
name = "type-speed-app"
version = "0.1.0"
description = "A desktop typing speed test app built with Tkinter"
readme = "README.md"
license = "Unlicense"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
  "basedpyright>=1.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/type_speed"]

[tool.uv]
package = true

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov=type_speed", "--cov-report=term-missing"]

[tool.coverage.run]
source = ["type_speed"]
branch = false

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.basedpyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
